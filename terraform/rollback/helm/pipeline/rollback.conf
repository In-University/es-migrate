# One-shot delta sync: everything on ES9's bench-es9 with updated_at strictly
# after the recorded cutover marker gets upserted into ES6's bench-es6.
#
# This pipeline only ever creates/updates -- it has no way to see documents
# that were hard-deleted on ES9 (they simply don't match any query). That gap
# is handled separately, after this pipeline drains, by
# scripts/reconcile_deletes.sh (an ID-diff between the two indices' live
# _id sets). See docs/MAPPING-DIFFERENCES.md and
# docs/superpowers/specs/2026-07-21-es9-es6-rollback-design.md.
#
# No `schedule` on the input: the elasticsearch input plugin scrolls through
# every match once and stops. That single pass is the entire delta sync.

input {
  elasticsearch {
    hosts    => ["${ES9_HOST}"]
    user     => "${ES9_USER}"
    password => "${ES9_PASSWORD}"
    index    => "bench-es9"
    query    => '{ "query": { "range": { "updated_at": { "gt": "${CUTOVER_AT}" } } } }'
    size     => 5000
    scroll   => "5m"
    docinfo  => true
  }
}

filter {
  mutate {
    remove_field => ["@version", "@timestamp"]
  }
}

output {
  elasticsearch {
    hosts         => ["${ES6_HOST}"]
    user          => "${ES6_USER}"
    password      => "${ES6_PASSWORD}"
    index         => "bench-es6"
    document_id   => "%{[@metadata][_id]}"
    doc_as_upsert => true
    action        => "update"
  }
}
